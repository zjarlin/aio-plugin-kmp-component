name: Verify plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: 安装固定的 Component 工具链
        run: |
          cargo install --locked --git https://github.com/Kotlin/wit-bindgen.git --rev 700f2db5e1d01f7bee8d756750c6f631171f520e wit-bindgen-cli
          cargo install --locked wasm-tools --version 1.240.0

      - name: 核对 WIT 生成绑定
        run: ./scripts/generate-bindings.sh --check

      - name: 构建和测试 KMP 模型
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: "1"
        run: |
          ./kotlin build -m model -p jvm -p wasmJs -p wasmWasi
          ./kotlin test -m model -p jvm

      - name: 构建并核对 Wasm Component
        run: |
          ./scripts/build-component.sh
          git diff --exit-code -- component/src

      - name: 检出 AIO 校验器
        uses: actions/checkout@v4
        with:
          repository: zjarlin/aio
          ref: 68ab02d1b65928b011f764b114d69e9d8ed9ee20
          path: aio-host-source
          submodules: recursive

      - name: 验证 AIO 插件协议
        run: cargo +nightly run --manifest-path aio-host-source/Cargo.toml --bin aio -- plugin validate "$GITHUB_WORKSPACE"

      - name: 发布已验证的 Component
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AIO_PLUGIN_PUBLISH_URL != ''
        env:
          AIO_PLUGIN_PUBLISH_TOKEN: ${{ secrets.AIO_PLUGIN_PUBLISH_TOKEN }}
          AIO_PLUGIN_PUBLISH_URL: ${{ vars.AIO_PLUGIN_PUBLISH_URL }}
        run: |
          if [ -z "$AIO_PLUGIN_PUBLISH_TOKEN" ]; then
            exit 0
          fi
          artifact_file="$RUNNER_TEMP/plugin.wasm.base64"
          base64 --wrap=0 dist/plugin.wasm | tr -d '\n' > "$artifact_file"
          artifact_sha256="$(sha256sum dist/plugin.wasm | awk '{print $1}')"
          jq -n \
            --arg git "${{ github.server_url }}/${{ github.repository }}.git" \
            --arg rev "$GITHUB_SHA" \
            --rawfile manifest aio-plugin.toml \
            --rawfile artifact_base64 "$artifact_file" \
            --arg artifact_sha256 "$artifact_sha256" \
            '{git:$git, rev:$rev, manifest_toml:$manifest, artifact_base64:$artifact_base64, artifact_sha256:$artifact_sha256}' \
            | gzip -c \
            | curl --fail-with-body --show-error --request POST \
                --header 'content-encoding: gzip' \
                --header "authorization: Bearer $AIO_PLUGIN_PUBLISH_TOKEN" \
                --header 'content-type: application/json' \
                --data-binary @- "$AIO_PLUGIN_PUBLISH_URL"

      - name: 检出 Wasmtime 运行时宿主
        uses: actions/checkout@v4
        with:
          repository: zjarlin/aio-public-shell
          ref: 859019163c72bf90bad2433b005f11bdc3c5626c
          path: aio-public-shell

      - name: 验证 KMP Component 租户隔离
        env:
          AIO_TEST_WASM_COMPONENT: ${{ github.workspace }}/dist/plugin.wasm
        working-directory: aio-public-shell
        run: cargo test --no-default-features --features server activates_reuses_and_destroys_tenant_instances -- --ignored
